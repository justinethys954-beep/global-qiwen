name: Daily stories

on:
  schedule:
    # 09:00 Asia/Shanghai, year-round. Re-run any time from the Actions tab.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sources and translate
        run: python3 scripts/update.py
      - name: Commit story data
        run: |
          git config user.name "oddnews-bot"
          git config user.email "oddnews-bot@users.noreply.github.com"
          git add data/stories.json public/data/stories.json
          if [ -f out/data/stories.json ]; then
            git add out/data/stories.json
          fi
          if git diff --cached --quiet; then
            echo "No story changes"
          else
            git commit -m "Update daily odd news"
            git push
          fi
