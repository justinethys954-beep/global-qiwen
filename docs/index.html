<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图录日课 · 中国文物拍卖</title>
  <meta name="description" content="每天早上翻一页：嘉德、保利、苏富比、佳士得公开图录里的中国文物。只链到官网，图片不能拿去发公众号。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <p class="eyebrow">中国文物 · 四家公开图录</p>
      <h1>图录日课</h1>
      <p class="lede">每天早上翻一页。只收中国嘉德、保利、苏富比、佳士得公开目录里的陶瓷、玉器、青铜、造像与古董珍玩。珠宝、名酒、汽车、时装和西方当代不收。</p>
      <div class="meta-row" id="meta-row">
        <span id="generated">正在读取目录…</span>
      </div>
    </div>
  </header>

  <main>
    <section class="houses" id="houses" aria-label="各家本日情况"></section>

    <section class="filters" aria-label="筛选">
      <label class="search">
        <span class="sr">搜索</span>
        <input id="q" type="search" placeholder="搜拍品、专场、图录号" autocomplete="off">
      </label>
      <label>拍行
        <select id="house">
          <option value="">全部</option>
        </select>
      </label>
      <label>状态
        <select id="status">
          <option value="">全部</option>
          <option value="upcoming">即将上拍 / 进行中</option>
          <option value="preview">预展</option>
          <option value="sold">已成交</option>
          <option value="unsold">未成交</option>
          <option value="closed">已结束，成交价未公开</option>
          <option value="withdrawn">撤拍</option>
        </select>
      </label>
      <label>品类
        <select id="category">
          <option value="">全部</option>
        </select>
      </label>
      <label>排序
        <select id="sort">
          <option value="new">新见优先</option>
          <option value="upcoming">即将开拍</option>
          <option value="recent">最近成交</option>
        </select>
      </label>
      <label class="check">
        <input id="only-new" type="checkbox">
        只看今日新见
      </label>
    </section>

    <section>
      <div class="section-head">
        <h2>专场</h2>
        <p id="sale-count"></p>
      </div>
      <div class="sale-row" id="sales"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>拍品</h2>
        <p id="lot-count"></p>
      </div>
      <div id="state" class="state">正在整理这一页…</div>
      <div class="cards" id="cards"></div>
      <div class="pager" id="pager"></div>
    </section>
  </main>

  <footer>
    <p>图片与图录版权归拍行，仅供检索，不可当原创配图发公众号。</p>
    <p>成交价按各家官网口径：佳士得 Price realised、北京保利 dealPrice 通常含佣；落槌价只有官网单独给出时才写。没有的字段留空，不估、不补。</p>
    <p>点进官网看原件。本页不是拍行镜像，也不是史料库。</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
